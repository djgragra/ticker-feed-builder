name: Build installers

on:
  push:
    tags: ['v*']
  # Start from the Actions tab (or from a chat) with a version to build AND publish the release:
  # the tag is created by GitHub on the tip of main. Without a version it only builds.
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version (the one in package.json, for example 26.10.8). Empty = build only."
        required: false
        default: ""

jobs:
  # A release must carry the version in package.json, and it must be higher than the latest
  # release: the in-app update check only offers strictly newer versions.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json and is newer than the latest release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_version != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ -n "$RELEASE_VERSION" ]; then
            TAG="${RELEASE_VERSION#v}"
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::A release started by hand must run on main (this run is on $GITHUB_REF_NAME)"; exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$TAG" >/dev/null 2>&1; then
              echo "::error::Tag v$TAG already exists: use a higher version, or delete the unused tag first"; exit 1
            fi
          fi
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION"; exit 1
          fi
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          LATEST="${LATEST#v}"
          echo "package.json: $VERSION  latest release: ${LATEST:-none}"
          if [ -n "$LATEST" ]; then
            node -e '
              const p = (v) => v.split(".").map((n) => parseInt(n, 10) || 0);
              const [a, b] = [p(process.argv[1]), p(process.argv[2])];
              for (let i = 0; i < Math.max(a.length, b.length); i++) {
                const d = (a[i] || 0) - (b[i] || 0);
                if (d) process.exit(d > 0 ? 0 : 1);
              }
              process.exit(1);
            ' "$VERSION" "$LATEST" || { echo "::error::Version $VERSION must be greater than the latest release $LATEST"; exit 1; }
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  build:
    needs: [check-version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            command: npm run dist:win
            artifact: release/*.exe
          - os: macos-latest
            name: macos
            command: npx electron-builder --mac --x64 --arm64
            artifact: release/*.dmg
          - os: ubuntu-latest
            name: linux
            command: npm run dist:linux
            artifact: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.name }} installer
        run: ${{ matrix.command }}
        env:
          # No signing certificates: builds are unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticker-feed-builder-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1  # only needed to hand files to the release job; keeps Actions storage near zero

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # tag pushed: its own name; started by hand: v<version>, created by GitHub on this commit
          tag_name: ${{ github.event.inputs.release_version != '' && format('v{0}', github.event.inputs.release_version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
