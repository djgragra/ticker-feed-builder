<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticker Feed Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="logo.svg" alt="" width="26" height="26"><span class="brand-name">Ticker Feed Builder</span><span class="brand-ver" id="ver"></span></div>
    <div class="top-status" id="topStatus"></div>
    <div class="top-actions">
      <button class="btn" id="btnPause"></button>
      <select id="theme" aria-label="Theme"><option value="dark" data-i18n="theme.dark">Dark</option><option value="light" data-i18n="theme.light">Light</option><option value="auto" data-i18n="theme.auto">Auto</option></select>
      <select id="lang" aria-label="Language"><option value="en">English</option><option value="it">Italiano</option><option value="es">Español</option></select>
      <button class="btn" id="btnHelp" data-i18n="help.open"></button>
      <button class="btn" id="btnSettings" data-i18n="settings.open"></button>
    </div>
  </header>

  <div id="updateBar" class="update-bar" hidden>
    <span id="updateText"></span>
    <button class="btn small" id="updateDownload" data-i18n="update.download"></button>
    <button class="btn small" id="updateNotes" data-i18n="update.notes"></button>
    <button class="btn small" id="updateClose" aria-label="Close">×</button>
  </div>

  <div class="layout">
    <nav class="rail" aria-label="Profiles">
      <button class="btn block dash-btn" id="btnDash"><span class="led" id="dashLed"></span><span data-i18n="rail.dashboard"></span></button>
      <div class="rail-title-row"><div class="rail-title" data-i18n="rail.profiles"></div><button class="btn small" id="btnSortAz" data-i18n="rail.sortAz" data-i18n-title="rail.sortHint"></button></div>
      <ul id="profileList" class="profile-list"></ul>
      <button class="btn block" id="btnNewProfile" data-i18n="rail.new"></button>
    </nav>
    <main id="main" class="main"></main>
  </div>

  <dialog id="dlgSettings" class="dlg wide">
    <div class="dlg-head"><h2 data-i18n="settings.title"></h2><button class="btn small" data-close aria-label="Close">×</button></div>
    <div class="dlg-body" id="settingsBody"></div>
  </dialog>

  <dialog id="dlgHelp" class="dlg wide">
    <div class="dlg-head"><h2 data-i18n="help.title"></h2><button class="btn small" data-close aria-label="Close">×</button></div>
    <div class="dlg-body help" id="helpBody"></div>
  </dialog>

  <dialog id="dlgTest" class="dlg wide">
    <div class="dlg-head"><h2 data-i18n="test.title"></h2><button class="btn small" data-close aria-label="Close">×</button></div>
    <div class="dlg-body" id="testBody"></div>
  </dialog>

  <dialog id="dlgNew" class="dlg">
    <div class="dlg-head"><h2 data-i18n="new.title"></h2><button class="btn small" data-close aria-label="Close">×</button></div>
    <div class="dlg-body">
      <label class="field"><span data-i18n="new.name"></span><input id="newName" type="text" maxlength="60"></label>
      <label class="check"><input id="newStarter" type="checkbox" checked><span data-i18n="new.starter"></span></label>
      <p class="hint" data-i18n="new.starterHint"></p>
      <div class="dlg-actions"><button class="btn" data-close data-i18n="common.cancel"></button><button class="btn primary" id="newCreate" data-i18n="new.create"></button></div>
    </div>
  </dialog>

  <dialog id="dlgConfirm" class="dlg">
    <div class="dlg-head"><h2 id="confirmTitle"></h2></div>
    <div class="dlg-body"><p id="confirmText"></p>
      <div class="dlg-actions"><button class="btn" data-close data-i18n="common.cancel"></button><button class="btn danger" id="confirmOk" data-i18n="common.delete"></button></div>
    </div>
  </dialog>

  <script src="i18n.js"></script>
  <script src="help.js"></script>
  <script src="app.js"></script>
</body>
</html>
